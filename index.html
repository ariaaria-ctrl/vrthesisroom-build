<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover" />
        <title>Unity Web Player | VR Thesis Room</title>
        <link rel="shortcut icon" href="TemplateData/favicon.ico" />
        <link rel="stylesheet" href="TemplateData/style.css" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <style>
            #fullscreen-btn {
                position: fixed;
                top: 12px;
                right: 12px;
                z-index: 9998;
                background: rgba(0,0,0,0.6);
                color: #fff;
                border: 1px solid rgba(255,255,255,0.4);
                border-radius: 6px;
                padding: 8px 14px;
                font-family: sans-serif;
                font-size: 14px;
                cursor: pointer;
            }
            #ios-home-prompt {
                display: none;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                z-index: 9999;
                background: rgba(20,20,20,0.95);
                color: #fff;
                font-family: sans-serif;
                font-size: 14px;
                padding: 14px 16px;
                box-sizing: border-box;
                text-align: center;
                border-top: 1px solid rgba(255,255,255,0.2);
            }
            #ios-home-prompt.visible {
                display: block;
            }
            #ios-home-prompt .close-btn {
                position: absolute;
                top: 6px;
                right: 10px;
                color: #aaa;
                font-size: 18px;
                cursor: pointer;
                background: none;
                border: none;
            }
            #rotate-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #000;
                color: #fff;
                z-index: 9997;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-family: sans-serif;
                padding: 20px;
                box-sizing: border-box;
            }
            #rotate-overlay.visible {
                display: flex;
            }
            #gyro-permission-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.85);
                z-index: 10000;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: sans-serif;
            }
            #gyro-permission-btn {
                padding: 14px 28px;
                font-size: 16px;
                font-weight: bold;
                color: white;
                background: #007aff;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            }
            #tap-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.85);
                color: #ffffff;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9996;
                font-family: sans-serif;
                text-align: center;
                cursor: pointer;
                user-select: none;
                -webkit-user-select: none;
            }
            #tap-overlay h1 {
                font-size: 28px;
                margin-bottom: 10px;
                letter-spacing: 1px;
            }
            #tap-overlay p {
                font-size: 15px;
                opacity: 0.75;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div id="tap-overlay">
            <h1>Tap Screen to Enter</h1>
            <p>Touch anywhere to start experience</p>
        </div>

        <div id="gyro-permission-overlay">
            <p style="color:white; margin-bottom: 20px; text-align: center; padding: 0 20px;">
                Tap below to enable motion and gyroscope controls.
            </p>
            <button id="gyro-permission-btn">Enable Motion Sensors</button>
        </div>

        <div id="rotate-overlay">
            <div>Please rotate your device to landscape to continue</div>
        </div>

        <button id="fullscreen-btn">⛶ Fullscreen</button>

        <div id="ios-home-prompt">
            <button class="close-btn" id="ios-home-close">&#215;</button>
            For the best fullscreen experience: tap <strong>Share</strong> below, then <strong>Add to Home Screen</strong>, and open PATCHES from there.
        </div>

        <div id="unity-container" class="unity-desktop">
            <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <div id="unity-warning"></div>
            <div id="unity-footer">
                <div id="unity-logo-title-footer"></div>
                <div id="unity-fullscreen-button"></div>
                <div id="unity-build-title">VR Thesis Room</div>
            </div>
        </div>

        <script>
            // <![CDATA[
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGl.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGl.data.unityweb",
        frameworkUrl: buildUrl + "/WebGl.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "VR Thesis Room",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window._unityInstance = unityInstance;
          window.unityInstance = unityInstance;

          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      function isIOS() {
        return /iPhone|iPad|iPod/i.test(navigator.userAgent) && !window.MSStream;
      }
      function isInStandaloneMode() {
        return ('standalone' in window.navigator) && window.navigator.standalone;
      }
      function isMobileDevice() {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      }

      if (isIOS() && !isInStandaloneMode()) {
        document.querySelector('#fullscreen-btn').style.display = 'none';
        var prompt = document.querySelector('#ios-home-prompt');
        prompt.classList.add('visible');
        document.querySelector('#ios-home-close').addEventListener('click', function() {
          prompt.classList.remove('visible');
        });
      } else {
        document.querySelector('#ios-home-prompt').style.display = 'none';
      }

      document.querySelector('#fullscreen-btn').addEventListener('click', function() {
        var el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(function(err) {
            console.log('Fullscreen request failed: ' + err);
          });
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      });

      function checkOrientation() {
        if (!isMobileDevice()) return;
        var overlay = document.querySelector('#rotate-overlay');
        var isPortrait = window.innerHeight > window.innerWidth;
        if (isPortrait) {
          overlay.classList.add('visible');
        } else {
          overlay.classList.remove('visible');
        }
      }
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
      window.addEventListener('load', checkOrientation);
      checkOrientation();

      // Tap screen overlay dismiss
      (function() {
        var tapOverlay = document.getElementById("tap-overlay");
        function dismissTapOverlay() {
          if (tapOverlay) {
            tapOverlay.style.display = "none";
          }
        }
        if (tapOverlay) {
          tapOverlay.addEventListener("click", dismissTapOverlay);
          tapOverlay.addEventListener("touchend", dismissTapOverlay);
        }
      })();

      (function() {
        var overlay = document.getElementById("gyro-permission-overlay");
        var btn = document.getElementById("gyro-permission-btn");

        var needsPermission = typeof DeviceOrientationEvent !== "undefined" &&
                              typeof DeviceOrientationEvent.requestPermission === "function";

        if (needsPermission) {
          overlay.style.display = "flex";
          btn.addEventListener("click", function() {
            DeviceOrientationEvent.requestPermission()
              .then(function(state) {
                if (state === "granted" && typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
                  return DeviceMotionEvent.requestPermission();
                }
              })
              .then(function() {
                overlay.style.display = "none";
                if (window._skJsLibGyro) {
                  window._skJsLibGyro.startGyroscope();
                  window._skJsLibGyro.startAccelerometer();
                }
              })
              .catch(function(err) {
                console.error("Permission error:", err);
                overlay.style.display = "none";
              });
          });
        }
      })();
      // ]]>
        </script>
    </body>
</html>
